services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codepilot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    profiles:
      - optional

  milvus:
    image: milvusdb/milvus:v3.0.5
    container_name: codepilot-milvus
    restart: "on-failure:3"
    stop_grace_period: 60s
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      # 主机端口避开 19530/9091：ecommerce-customer-service 的 cs-milvus 已占用
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9092:9091"
    volumes:
      - codepilot_milvus_official_data:/var/lib/milvus
      - ./deploy/embed-etcd.yaml:/milvus/configs/embedEtcd.yaml:ro

volumes:
  devflow_postgres_data:
  codepilot_milvus_official_data:
