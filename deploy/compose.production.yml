name: codepilot-production
x-app: &app
  image: codepilot-api:${RELEASE_TAG:?Set an immutable release tag}
  pull_policy: never
  build: {context: .., dockerfile: backend/Dockerfile}
  environment: &environment
    APP_ENV: production
    DEMO_MODE: 'false'
    BACKGROUND_EXECUTION_MODE: external
    DATABASE_URL: postgresql+psycopg://codepilot:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/codepilot
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY}
    TOKEN_ENCRYPTION_PREVIOUS_KEYS: ${TOKEN_ENCRYPTION_PREVIOUS_KEYS:-}
    GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS origin}
    OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:?Set outbound hosts}
    LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL}
    EMBEDDING_PROVIDER: dashscope
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
    MILVUS_ENABLED: 'true'
    MILVUS_TOKEN: ${MILVUS_TOKEN:?Set MILVUS_TOKEN}
    REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
    AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-60}
    AI_GLOBAL_REQUESTS_PER_HOUR: ${AI_GLOBAL_REQUESTS_PER_HOUR:-300}
    MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-500}
    MAX_EVAL_CASES: ${MAX_EVAL_CASES:-20}
    MAX_EVAL_TOKENS: ${MAX_EVAL_TOKENS:-1000000}
    MAX_SNAPSHOT_CHUNKS: ${MAX_SNAPSHOT_CHUNKS:-2000}
    MAX_KNOWLEDGE_SNAPSHOTS: ${MAX_KNOWLEDGE_SNAPSHOTS:-10}
    AI_CONCURRENT_REQUESTS: ${AI_CONCURRENT_REQUESTS:-2}
    CONTEXT_RESERVED_RESPONSE_TOKENS: ${CONTEXT_RESERVED_RESPONSE_TOKENS:-3000}
    CI_SANDBOX_ENABLED: 'false'
    MILVUS_URI: http://milvus:19530
    REPO_CHECKOUT_DIR: /data/repos
    UPLOAD_DIR: /data/uploads
    AUTO_SYNC_ENABLED: 'true'
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=128m,noexec,nosuid']
  volumes: [repos:/data/repos, uploads:/data/uploads]
  networks: [application, storage]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}
  mem_limit: 2g
  cpus: 2.0
  pids_limit: 256
services:
  backup:
    image: codepilot-backup:${RELEASE_TAG:?Set an immutable release tag}
    pull_policy: never
    build: {context: .., dockerfile: deploy/Backup.Dockerfile}
    profiles: [ops]
    environment:
      DATABASE_URL: postgresql+psycopg://codepilot:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/codepilot
      RESTORE_DATABASE_URL: postgresql+psycopg://codepilot_migrator:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}@postgres:5432/${RESTORE_DATABASE_NAME:-codepilot_restore}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY}
    volumes: [uploads:/uploads:ro, ./backups:/backups, backup_work:/work, recovered_uploads:/restore_uploads]
    networks: [storage]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    restart: 'no'
    environment:
      <<: *environment
      DATABASE_URL: postgresql+psycopg://codepilot_migrator:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}@postgres:5432/codepilot
    depends_on: {postgres: {condition: service_healthy}}
  bootstrap-milvus:
    <<: *app
    command: [python, -m, app.bootstrap_milvus]
    restart: 'no'
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD:?Set MILVUS_ROOT_PASSWORD}
      MILVUS_APP_PASSWORD: ${MILVUS_APP_PASSWORD:?Set MILVUS_APP_PASSWORD}
    depends_on: {milvus: {condition: service_healthy}}
  api:
    <<: *app
    environment:
      <<: *environment
      RELEASE_GATE_EVAL_ID: ${RELEASE_GATE_EVAL_ID:-}
      RELEASE_GATE_REQUIRED: ${RELEASE_GATE_REQUIRED:-false}
    depends_on: {migrate: {condition: service_completed_successfully}, bootstrap-milvus: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  worker:
    <<: *app
    command: [python, -m, app.worker]
    environment:
      <<: *environment
      WORKER_KINDS: process_knowledge_document,scan_project_index_by_id,sync_repository_code_analysis_by_id,sync_repository_by_id,_execute_rag_eval_job,_execute_rescore_job
      WORKER_CONCURRENCY: '2'
    depends_on: {migrate: {condition: service_completed_successfully}, bootstrap-milvus: {condition: service_completed_successfully}}
  scheduler:
    <<: *app
    command: [python, -m, app.worker, --scheduler]
    depends_on: {migrate: {condition: service_completed_successfully}}
  frontend:
    image: codepilot-web:${RELEASE_TAG:?Set an immutable release tag}
    pull_policy: never
    build: {context: .., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    networks: [application]
  gateway:
    image: codepilot-gateway:${RELEASE_TAG:?Set an immutable release tag}
    pull_policy: never
    build: {context: .., dockerfile: deploy/Gateway.Dockerfile}
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    tmpfs: ['/tmp:size=64m,nosuid,noexec']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['80:8080', '443:8443']
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro, ./tls:/etc/tls:ro]
    depends_on: {api: {condition: service_healthy}, frontend: {condition: service_started}}
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, 'https://127.0.0.1:8443/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [application]
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}
  postgres:
    image: codepilot-postgres:${RELEASE_TAG:?Set an immutable release tag}
    pull_policy: never
    build: {context: .., dockerfile: deploy/Postgres.Dockerfile}
    restart: unless-stopped
    user: '70:70'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: codepilot_admin
      POSTGRES_DB: codepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes: [postgres:/var/lib/postgresql, ./init-postgres.sh:/docker-entrypoint-initdb.d/10-codepilot.sh:ro]
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U codepilot_admin -d codepilot']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 2g
  milvus:
    image: codepilot-milvus:${RELEASE_TAG:?Set an immutable release tag}
    pull_policy: never
    build: {context: .., dockerfile: deploy/Milvus.Dockerfile}
    restart: "on-failure:3"
    stop_grace_period: 60s
    ulimits: {core: 0}
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
    command: [milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes: [milvus:/var/lib/milvus, ./milvus.yaml:/milvus/configs/user.yaml:ro, ./embed-etcd.yaml:/milvus/configs/embedEtcd.yaml:ro]
    networks: [storage]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 4g
networks:
  application: {}
  storage: {internal: true}
volumes:
  postgres: {}
  repos: {}
  uploads: {}
  milvus: {}
  backup_work: {}
  recovered_uploads: {}
