worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    log_format safe '$request_id $request_method $status $request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    client_max_body_size 14m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api { zone api 64k; server api:8000 resolve; }
    upstream frontend { zone frontend 64k; server frontend:3000 resolve; }
    server {
        listen 8080;
        return 308 https://$host$request_uri;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        location /api/ {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 610s;
        }
        location /health { return 404; }
        location / { proxy_pass http://frontend; proxy_set_header Host $host; }
    }
}
